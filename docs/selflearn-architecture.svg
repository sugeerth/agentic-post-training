<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1215 690" width="1215" height="690" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#0f172a}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#475569}
      .d{font-size:12.5px;fill:#334155}
      .lab{font-size:11px;font-weight:700;letter-spacing:.08em;fill:#64748b}
      .e{font-size:11px;fill:#334155}
      .ln{stroke:#334155;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect width="1215" height="690" rx="14" fill="#ffffff"/>
  <text x="30" y="32" class="t" font-size="18">Self-learning agentic RL post-training: architecture</text>
  <text x="30" y="50" class="e">Arrows = data flow. Each agent sits above the code it uses. Dependencies point down only; the top two layers import no ML library.</text>

  <!-- Coordinator -->
  <rect x="30" y="64" width="1155" height="66" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="48" y="90" class="t">Coordinator</text>
  <text x="48" y="114" class="m" font-size="13" fill="#3730a3">assess → calibrate → [ propose → act → verify → observe → learn ] × N → re-assess</text>
  <text x="1167" y="90" class="e" text-anchor="end">depends only on role interfaces (Protocols); tested with fake agents</text>
  <text x="1167" y="110" class="e" text-anchor="end">optional Selector: keeps the best checkpoint by a validation set</text>

  <!-- Agents -->
  <text x="30" y="156" class="lab">AGENTS · ONE JOB EACH</text>
  <g>
    <rect x="30" y="164" width="175" height="104" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="42" y="188" class="t">Curriculum</text><text x="42" y="207" class="m">propose() · observe()</text>
    <text x="42" y="229" class="d">picks levels where its</text><text x="42" y="246" class="d">own attempts disagree</text>
  </g>
  <g>
    <rect x="275" y="164" width="175" height="104" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="287" y="188" class="t">Actor</text><text x="287" y="207" class="m">act()</text>
    <text x="287" y="229" class="d">multi-turn tool use</text><text x="287" y="246" class="d">keeps exact token ids</text>
  </g>
  <g>
    <rect x="520" y="164" width="175" height="104" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="532" y="188" class="t">Verifier</text><text x="532" y="207" class="m">score()</text>
    <text x="532" y="229" class="d">checks the final answer</text><text x="532" y="246" class="d">reward from the use case</text>
  </g>
  <g>
    <rect x="765" y="164" width="175" height="104" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="777" y="188" class="t">Learner</text><text x="777" y="207" class="m">learn()</text>
    <text x="777" y="229" class="d">GRPO on its own attempts</text><text x="777" y="246" class="d">tool output is masked</text>
  </g>
  <g>
    <rect x="1010" y="164" width="175" height="104" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="1022" y="188" class="t">Assessor</text><text x="1022" y="207" class="m">assess()</text>
    <text x="1022" y="229" class="d">Actor + Verifier, greedy,</text><text x="1022" y="246" class="d">on the fixed held-out set</text>
  </g>
  <!-- forward data flow -->
  <path d="M205 216H273" class="ln" marker-end="url(#a)"/><text x="239" y="208" class="e" text-anchor="middle">16 tasks</text>
  <path d="M450 216H518" class="ln" marker-end="url(#a)"/><text x="484" y="208" class="e" text-anchor="middle">128 tries</text>
  <path d="M695 216H763" class="ln" marker-end="url(#a)"/><text x="729" y="208" class="e" text-anchor="middle">rewards</text>
  <!-- feedback loops -->
  <path d="M852 268V298H362V272" class="ln" marker-end="url(#a)"/>
  <text x="740" y="292" class="e" text-anchor="middle">updated LoRA = the Actor's policy</text>
  <path d="M607 268V318H117V272" class="ln" marker-end="url(#a)"/>
  <text x="250" y="312" class="e" text-anchor="middle">observe: success per level</text>

  <!-- Bus -->
  <rect x="30" y="332" width="1155" height="28" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="48" y="351" class="d"><tspan font-weight="700">Bus</tspan> · every agent reports one-line messages → messages.jsonl   (e.g. "Learner → Coordinator: updated on 5/16 groups, grad norm 1.3")</text>

  <!-- Domain -->
  <text x="30" y="390" class="lab">DOMAIN · PURE PYTHON, NO ML LIBRARY, UNIT-TESTED</text>
  <g fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4">
    <rect x="30" y="398" width="175" height="86" rx="10"/><rect x="275" y="398" width="175" height="86" rx="10"/>
    <rect x="520" y="398" width="175" height="86" rx="10"/><rect x="765" y="398" width="175" height="86" rx="10"/>
    <rect x="1010" y="398" width="175" height="86" rx="10"/>
  </g>
  <text x="42" y="421" class="t" font-size="14">curriculum.py</text><text x="42" y="443" class="d">weight = 1 − p<tspan dy="-5" font-size="9">G</tspan><tspan dy="5"> − (1 − p)</tspan><tspan dy="-5" font-size="9">G</tspan></text><text x="42" y="461" class="d">EMA success per level</text>
  <text x="287" y="421" class="t" font-size="14">tools.py</text><text x="287" y="443" class="d">parses &lt;tool&gt;…&lt;/tool&gt; calls</text><text x="287" y="461" class="d">for any tool registry</text>
  <text x="532" y="421" class="t" font-size="14">verifier.py</text><text x="532" y="443" class="d">exact answer → 1.0;</text><text x="532" y="461" class="d">a use case can override</text>
  <text x="777" y="421" class="t" font-size="14">grpo.py (advantages)</text><text x="777" y="443" class="d">(r − mean) / std per task</text><text x="777" y="461" class="d">no-spread groups dropped</text>
  <text x="1022" y="421" class="t" font-size="14">usecases/</text><text x="1022" y="443" class="d">math: calculator problems</text><text x="1022" y="461" class="d">support: refund decisions</text>

  <!-- ML runtime -->
  <text x="30" y="514" class="lab">ML RUNTIME · MLX ON THE APPLE GPU</text>
  <g fill="#fff7ed" stroke="#ea580c" stroke-width="1.4">
    <rect x="275" y="522" width="175" height="86" rx="10"/><rect x="520" y="522" width="175" height="86" rx="10"/>
    <rect x="765" y="522" width="175" height="86" rx="10"/>
  </g>
  <text x="287" y="545" class="t" font-size="14">rollout.py</text><text x="287" y="567" class="d">batched sampling, stops at</text><text x="287" y="585" class="d">tags; tool tokens masked</text>
  <text x="532" y="545" class="t" font-size="14">Qwen2.5 0.5B / 1.5B</text><text x="532" y="567" class="d">4-bit + LoRA on all</text><text x="532" y="585" class="d">linear layers</text>
  <text x="777" y="545" class="t" font-size="14">GRPOLearner</text><text x="777" y="567" class="d">policy gradient + KL anchor</text><text x="777" y="585" class="d">to the base · LoRA r16, s2</text>
  <path d="M450 565H518" class="ln" marker-end="url(#a)"/><text x="484" y="557" class="e" text-anchor="middle">samples</text>
  <path d="M765 565H697" class="ln" marker-end="url(#a)"/><text x="731" y="557" class="e" text-anchor="middle">updates</text>

  <!-- Entry points -->
  <g fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4">
    <rect x="30" y="522" width="175" height="86" rx="10"/><rect x="1010" y="522" width="175" height="86" rx="10"/>
  </g>
  <text x="42" y="545" class="t" font-size="14">train.py</text><text x="42" y="567" class="d">builds model + agents,</text><text x="42" y="585" class="d">runs the Coordinator</text>
  <text x="1022" y="545" class="t" font-size="14">report.py · demo.py</text><text x="1022" y="567" class="d">REPORT.md + report.png</text><text x="1022" y="585" class="d">base vs trained, 1 question</text>

  <text x="30" y="640" class="e">Outputs per run (runs/&lt;name&gt;/): messages.jsonl · steps.jsonl · eval_before.json · eval_after.json · examples.json · results.json · adapter/ (mlx_lm format)</text>
  <text x="30" y="660" class="e">Add a use case = one module (prompt, tools, task generator, reward) + one registry line. Swap a role (e.g. a DPO Learner) by implementing its one method.</text>
</svg>
